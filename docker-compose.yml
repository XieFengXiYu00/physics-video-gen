services:
  app:
    build: .
    ports:
      - "3001:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    extra_hosts:
      # DeepSeek DNS 在部分网络被屏蔽，固定真实 IP 绕过
      - "api.deepseek.com:211.95.70.108"
    restart: unless-stopped
