<svg width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="180" fill="#030712"/>
  <!-- Radial glow -->
  <ellipse cx="160" cy="60" rx="120" ry="50" fill="#3b82f6" opacity="0.08"/>
  <!-- Particles and connections -->
  <circle cx="60" cy="120" r="2.5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="95" cy="135" r="2" fill="#3b82f6" opacity="0.5"/>
  <circle cx="130" cy="125" r="3" fill="#3b82f6" opacity="0.7"/>
  <circle cx="160" cy="140" r="2" fill="#3b82f6" opacity="0.4"/>
  <circle cx="190" cy="130" r="2.5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="220" cy="145" r="2" fill="#3b82f6" opacity="0.5"/>
  <circle cx="250" cy="128" r="3" fill="#3b82f6" opacity="0.65"/>
  <circle cx="280" cy="138" r="2" fill="#3b82f6" opacity="0.45"/>
  <!-- Connection lines -->
  <line x1="60" y1="120" x2="95" y2="135" stroke="#3b82f6" stroke-width="0.6" opacity="0.25"/>
  <line x1="95" y1="135" x2="130" y2="125" stroke="#3b82f6" stroke-width="0.6" opacity="0.3"/>
  <line x1="130" y1="125" x2="160" y2="140" stroke="#3b82f6" stroke-width="0.6" opacity="0.2"/>
  <line x1="160" y1="140" x2="190" y2="130" stroke="#3b82f6" stroke-width="0.6" opacity="0.25"/>
  <line x1="190" y1="130" x2="220" y2="145" stroke="#3b82f6" stroke-width="0.6" opacity="0.2"/>
  <line x1="220" y1="145" x2="250" y2="128" stroke="#3b82f6" stroke-width="0.6" opacity="0.3"/>
  <line x1="250" y1="128" x2="280" y2="138" stroke="#3b82f6" stroke-width="0.6" opacity="0.2"/>
  <!-- Glow line -->
  <rect x="110" y="50" width="100" height="1.5" fill="url(#waveLine)" rx="1"/>
  <defs>
    <linearGradient id="waveLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Title -->
  <text x="160" y="82" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#f0f0f0" text-anchor="middle" letter-spacing="3">AI FUTURE</text>
  <!-- Subtitle -->
  <text x="160" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle" letter-spacing="2" opacity="0.8">探索人工智能的无限可能</text>
</svg>
