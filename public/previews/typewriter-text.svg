<svg width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="180" fill="#0a0a0a"/>
  <!-- Grid bg -->
  <line x1="0" y1="60" x2="320" y2="60" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="0" y1="92" x2="320" y2="92" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="0" y1="124" x2="320" y2="124" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <!-- Typewriter text -->
  <text x="70" y="88" font-family="'SF Mono', monospace" font-size="26" font-weight="700" fill="#f0f0f0">Hello World</text>
  <!-- Cursor -->
  <rect x="248" y="68" width="3" height="24" fill="#22d3ee"/>
  <!-- Subtitle -->
  <text x="70" y="118" font-family="monospace" font-size="12" fill="#22d3ee" letter-spacing="2" opacity="0.8">欢迎来到我的频道</text>
  <!-- Scanline -->
  <rect x="0" y="45" width="320" height="1.5" fill="rgba(34,211,238,0.15)"/>
</svg>
