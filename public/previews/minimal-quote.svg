<svg width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="180" fill="#fafaf9"/>
  <!-- Large quote mark -->
  <text x="40" y="70" font-family="Georgia, serif" font-size="100" fill="#facc15" opacity="0.2">&ldquo;</text>
  <!-- Accent line -->
  <rect x="130" y="60" width="60" height="2.5" fill="#facc15" rx="1"/>
  <!-- Quote text -->
  <text x="160" y="95" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1c1917" text-anchor="middle">简约是终极的复杂。</text>
  <!-- Author -->
  <text x="160" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#78716c" text-anchor="middle" letter-spacing="1.5">— 达·芬奇</text>
</svg>
