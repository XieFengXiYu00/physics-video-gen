<svg width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="180" fill="#09090b"/>
  <!-- Brick hint -->
  <rect x="10" y="10" width="40" height="18" fill="none" stroke="rgba(180,180,180,0.06)" stroke-width="0.5" rx="1"/>
  <rect x="55" y="10" width="40" height="18" fill="none" stroke="rgba(180,180,180,0.06)" stroke-width="0.5" rx="1"/>
  <rect x="100" y="10" width="40" height="18" fill="none" stroke="rgba(180,180,180,0.06)" stroke-width="0.5" rx="1"/>
  <rect x="30" y="32" width="40" height="18" fill="none" stroke="rgba(180,180,180,0.06)" stroke-width="0.5" rx="1"/>
  <rect x="75" y="32" width="40" height="18" fill="none" stroke="rgba(180,180,180,0.06)" stroke-width="0.5" rx="1"/>
  <!-- Ambient glow -->
  <ellipse cx="160" cy="90" rx="100" ry="60" fill="#e879f9" opacity="0.06"/>
  <!-- Neon text -->
  <text x="160" y="95" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#e879f9" text-anchor="middle" letter-spacing="4">NEON</text>
  <!-- Glow layers -->
  <text x="160" y="95" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="none" stroke="#e879f9" stroke-width="2" text-anchor="middle" letter-spacing="4" opacity="0.5" filter="url(#neonBlur)"/>
  <defs>
    <filter id="neonBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>
  </defs>
  <!-- Subtitle -->
  <text x="160" y="120" font-family="system-ui, sans-serif" font-size="12" fill="#e879f9" text-anchor="middle" letter-spacing="3" opacity="0.8">霓虹灯效果</text>
</svg>
