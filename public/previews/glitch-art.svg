<svg width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="180" fill="#0d0d12"/>
  <!-- Grid -->
  <line x1="0" y1="45" x2="320" y2="45" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
  <line x1="0" y1="90" x2="320" y2="90" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
  <line x1="0" y1="135" x2="320" y2="135" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
  <line x1="80" y1="0" x2="80" y2="180" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
  <line x1="160" y1="0" x2="160" y2="180" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
  <line x1="240" y1="0" x2="240" y2="180" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
  <!-- Glitch text -->
  <text x="160" y="82" font-family="monospace" font-size="32" font-weight="800" fill="#e4e4e7" text-anchor="middle" letter-spacing="-1">GLITCH</text>
  <!-- Red ghost -->
  <text x="163" y="82" font-family="monospace" font-size="32" font-weight="800" fill="#ff0050" text-anchor="middle" letter-spacing="-1" opacity="0.4">GLITCH</text>
  <!-- Cyan ghost -->
  <text x="157" y="82" font-family="monospace" font-size="32" font-weight="800" fill="#00ffff" text-anchor="middle" letter-spacing="-1" opacity="0.35">GLITCH</text>
  <text x="160" y="108" font-family="monospace" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle" letter-spacing="4">故障艺术</text>
  <!-- Scanline -->
  <rect x="0" y="65" width="320" height="1" fill="rgba(167,139,250,0.2)"/>
  <rect x="0" y="120" width="320" height="1" fill="rgba(167,139,250,0.15)"/>
</svg>
